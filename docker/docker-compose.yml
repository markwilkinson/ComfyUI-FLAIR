services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
    image: comfyui-flair:latest
    container_name: comfyui-flair
    restart: unless-stopped
    ports:
      # Bound to localhost only -- lighttpd (or whatever reverse proxy is in
      # front) talks to 127.0.0.1:8188 on the host; the port is not meant to
      # be reachable directly from outside the host.
      - "127.0.0.1:8188:8188"
    volumes:
      # Mutable ComfyUI data, persisted on the host across container
      # rebuilds/restarts.
      - ./data/models:/app/ComfyUI/models
      - ./data/input:/app/ComfyUI/input
      - ./data/output:/app/ComfyUI/output
      - ./data/user:/app/ComfyUI/user

      # FLAIR custom nodes: the whole custom-nodes/ directory from this repo
      # checkout, mounted as ComfyUI's entire custom_nodes/ dir. Any package
      # folder added under ../custom-nodes/ just appears -- no compose edit,
      # no rebuild. Edit a node's .py file on the host and it's live on
      # container restart. Note: this REPLACES the container's built-in
      # custom_nodes/ dir rather than adding to it, so the one stock example
      # ComfyUI ships there (websocket_image_save.py) won't show up -- not
      # part of this project, not a loss that matters here.
      - ../custom-nodes:/app/ComfyUI/custom_nodes:ro
