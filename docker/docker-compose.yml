services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile
    image: comfyui-flair:latest
    container_name: comfyui-flair
    restart: unless-stopped
    environment:
      # Externally-reachable base URL for this instance -- set once here by
      # whoever deploys this, so FLAIR_PackageProvenanceCrate can return a
      # fully-qualified, copy-paste-anywhere download URL instead of a
      # relative path end users would have to manually combine with the
      # hostname themselves. Currently just localhost:8188 (accessed
      # directly on the host, no reverse proxy in front yet); update this
      # to the real public hostname if/when one is added later.
      - FLAIR_PUBLIC_URL=http://localhost:8188
    ports:
      # Bound to localhost only -- lighttpd (or whatever reverse proxy is in
      # front) talks to 127.0.0.1:8188 on the host; the port is not meant to
      # be reachable directly from outside the host.
      - "127.0.0.1:8188:8188"
    volumes:
      # Mutable ComfyUI data, persisted on the host across container
      # rebuilds/restarts.
      - ./data/models:/app/ComfyUI/models
      - ./data/input:/app/ComfyUI/input
      - ./data/output:/app/ComfyUI/output
      - ./data/user:/app/ComfyUI/user

      # FLAIR custom nodes: the whole custom-nodes/ directory from this repo
      # checkout, mounted as ComfyUI's entire custom_nodes/ dir. Any package
      # folder added under ../custom-nodes/ just appears -- no compose edit,
      # no rebuild. Edit a node's .py file on the host and it's live on
      # container restart. Note: this REPLACES the container's built-in
      # custom_nodes/ dir rather than adding to it, so the one stock example
      # ComfyUI ships there (websocket_image_save.py) won't show up -- not
      # part of this project, not a loss that matters here.
      #
      # A fresh clone of ComfyUI-FLAIR only has flair_declutter and
      # flair-provenance under ../custom-nodes/ -- everything else (domain
      # node packages like flair-analytics) is opt-in, pulled in from
      # https://github.com/markwilkinson/ComfyUI-FLAIR-Catalog via
      # ../scripts/install_from_catalog.sh. The custodian of a given
      # deployment decides what actually lands here; nothing ships by
      # default beyond the two core packages.
      - ../custom-nodes:/app/ComfyUI/custom_nodes:ro

      # FLAIR workflows: ../workflows is a real, git-tracked directory in
      # this repo (not gitignored, unlike the rest of ./data/user/) --
      # mounted directly onto ComfyUI's actual workflow-loading path, one
      # level deeper than the ./data/user mount above (Docker resolves the
      # more specific nested mount for that subpath). A fresh clone ships
      # this empty (just a .gitkeep placeholder, so the directory itself
      # survives `git clone`) -- workflows are opt-in from the catalog repo
      # the same way node packages are, via ../scripts/install_from_catalog.sh.
      # Anything committed to ../workflows/*.json in THIS repo ships to every
      # deployment that clones it from then on; anything a user saves
      # through the UI lands there too, so `git status` in this repo shows
      # it as a real, reviewable change instead of invisible container state.
      - ../workflows:/app/ComfyUI/user/default/workflows

      # FLAIR-GG toolchain version (the same VERSION file bumped every
      # session per this project's changelog convention) -- read by
      # flair-provenance/nodes/packaging.py and stamped onto every node's
      # `softwareVersion` in the RO-Crate, so a crate records not just
      # which node ran but which version of this project's code it was.
      # Deliberately repo-wide, not per-node: there's no independent
      # per-node version scheme, and inventing one risks drifting stale
      # (a wrong version number is worse than none) for no real benefit,
      # since all FLAIR nodes ship from one repo on one release cycle.
      - ../VERSION:/app/ComfyUI/flair_version.txt:ro
